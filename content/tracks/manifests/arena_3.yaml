        axes: [mechanistic_interpretability]
        prereqs: ["1.3.1"]

      # 1.4.x branch: IOI and SAE circuits. 1.4.2 builds on SAE intro (1.3.3).
      - id: "1.4.1"
        title: "1.4.1 Indirect Object Identification"
        url: "https://arena-chapter1-transformer-interp.streamlit.app/[1.4.1]_Indirect_Object_Identification"
        kind: external_exercise
        duration_min: 240
        domain_tags: [ioi, circuits, attention]
        axes: [mechanistic_interpretability]
        prereqs: ["1.2"]

      - id: "1.4.2"
