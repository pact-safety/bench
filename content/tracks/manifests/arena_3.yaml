        duration_min: 420
        domain_tags: [sae, sparse autoencoder, interpretability]
        axes: [mechanistic_interpretability]
        prereqs: ["1.3.1"]

      - id: "1.3.4"
        title: "1.3.4 Activation Oracles"
        url: "https://arena-chapter1-transformer-interp.streamlit.app/[1.3.4]_Activation_Oracles"
