# RSS news feeds for the /news surface (rss-news-feed Phase 1).
#
# Edited freely by the operator. New entries take effect on the next
# poller tick (hourly by default; see app/services/news_poller.py).
#
# Tier 1 = labs + alignment forum. Higher signal-to-noise; show by
#          default on /news.
# Tier 2 = weekly digests + curated commentary. Slower-moving;
#          surface but de-emphasize visually.
#
# `slug` is the dedup + UI key. Keep it stable across renames; if you
# change a slug, all prior items still reference the old one and won't
# auto-migrate (small cost, easy to fix manually if you ever care).
#
# `url` is the RSS / Atom feed URL. feedparser handles both formats
# transparently.

# ============================================================
# Tier 1 — labs + canonical alignment publishers
# ============================================================

[[feed]]
slug = "anthropic"
name = "Anthropic News"
url = "https://www.anthropic.com/news/rss.xml"
tier = 1

[[feed]]
slug = "openai"
name = "OpenAI Blog"
url = "https://openai.com/blog/rss.xml"
tier = 1

[[feed]]
slug = "deepmind"
name = "Google DeepMind"
url = "https://deepmind.google/blog/rss.xml"
tier = 1

[[feed]]
