<!-- shared problem body (rendered inside each variant's main so the nav
     wraps it correctly). We use a small template literal in a script
     to avoid duplicating 100 lines three times. -->
<template id="problem-body">
  <article class="problem">
    <header class="problem__head">
      <div class="problem__meta">
        <span class="badge badge--code_compose">code compose</span>
        <span class="badge badge--time">15 min</span>
        <span class="badge badge--diff">medium</span>
        <span class="tag">algo</span>
        <span class="tag">hashmap</span>
      </div>
      <h1>Two-sum variants</h1>
      <p class="problem__try-interview muted">
        Practicing freely. <a href="#">→ try this in interview mode</a> for a timed, no-aids run.
      </p>
    </header>

    <section class="problem__prompt md">
      <p>Given an array of integers <code>nums</code> and an integer <code>target</code>, return <em>all unique pairs</em> <code>(i, j)</code> where <code>nums[i] + nums[j] == target</code>, with <code>i &lt; j</code>.</p>
      <p>Constraints:</p>
      <ul>
        <li><code>2 &lt;= len(nums) &lt;= 10⁵</code></li>
        <li><code>-10⁹ &lt;= nums[i] &lt;= 10⁹</code></li>
        <li>Each index can appear in at most one pair.</li>
      </ul>
      <p>Example:</p>
      <pre><code>nums   = [2, 7, 11, 15, -2]
target = 9
→ [(0, 1), (3, 4)]   # 2+7=9, 15+(-2)=... wait that's 13, ignore me</code></pre>
      <p>Walk through your approach before coding. State the complexity you're aiming for.</p>
    </section>

    <details class="refs">
      <summary>references for this problem</summary>
      <div class="refs__group">
        <h4 class="refs__group-label">Approach</h4>
        <ul class="refs__list">
          <li class="refs__item">
            <a href="#">Hash-map two-sum — CTCI 16.24</a>
            <span class="refs__book">Cracking the Coding Interview · p. 543</span>
            <span class="refs__why">Single-pass O(n) — classic pattern</span>
          </li>
        </ul>
      </div>
    </details>

    <form class="solve">
      <label for="approach">Approach (1-2 sentences before code)</label>
      <textarea id="approach" rows="3" placeholder="State the data structure + complexity you're going for…"></textarea>

      <div class="lang-toggle" style="margin-top: var(--space-4);">
        <span class="muted">Language:</span>
        <strong>Python</strong>
        <a href="#" class="muted">JS</a>
      </div>

      <textarea name="code" rows="14" spellcheck="false">def two_sum_pairs(nums, target):
    seen = {}
    pairs = []
    for i, n in enumerate(nums):
        if target - n in seen:
            pairs.append((seen[target - n], i))
        seen.setdefault(n, i)
    return pairs</textarea>

      <div class="confidence">
        <span>Confidence:</span>
        <label><input type="radio" name="conf" value="1"> 1 (guessing)</label>
        <label><input type="radio" name="conf" value="2"> 2</label>
        <label><input type="radio" name="conf" value="3" checked> 3</label>
        <label><input type="radio" name="conf" value="4"> 4</label>
        <label><input type="radio" name="conf" value="5"> 5 (rock solid)</label>
      </div>

      <p style="margin-top: var(--space-5);">
        <button type="button" class="primary">Run tests</button>
        <span class="muted" style="margin-left: var(--space-3);">submits to /submit/&lt;slug&gt; via HTMX</span>
      </p>
    </form>

    <!-- Mock result block — what the HTMX swap would render -->
    <section class="result result--pass" style="margin-top: var(--space-5);">
      <header class="result__head">
        <span class="result__verdict">PASS · 5/5</span>
        <span class="result__score">score: <strong>92</strong></span>
      </header>
      <p class="result__message">Clean single-pass O(n). Edge cases (empty input, all duplicates, negative numbers) all covered.</p>
      <pre class="result__output">tests/test_two_sum_pairs.py::test_empty PASSED
tests/test_two_sum_pairs.py::test_basic PASSED
tests/test_two_sum_pairs.py::test_duplicates PASSED
tests/test_two_sum_pairs.py::test_negatives PASSED
tests/test_two_sum_pairs.py::test_large_input PASSED [0.3s]
============================== 5 passed ==============================</pre>
    </section>

    <section class="review" style="margin-top: var(--space-5);">
      <header class="review__head">
        <h2 class="review__title">Review</h2>
        <span class="muted">model: claude-sonnet</span>
      </header>
      <p class="review__summary">Strong solution. Idiomatic Python — <code>setdefault</code> avoids the explicit guard. The <code>seen[target - n]</code> lookup pattern is the right one. One micro-nit: the variable <code>n</code> reads ambiguously in a Two-Sum context where N already means input length; <code>x</code> or <code>num</code> would be clearer.</p>
    </section>
  </article>
</template>
