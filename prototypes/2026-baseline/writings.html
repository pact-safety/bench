      <h1 class="page__title">Why I built a single-tenant interview-prep bench instead of using existing tools</h1>
      <p class="page__meta">14 min · word count 1,847 · last updated 2 hours ago</p>
    </header>

    <section class="md">
      <p>I spent roughly two months trying to use existing interview-prep platforms before I built this one. The short version: every tool I tried optimized for the wrong thing. LeetCode optimizes for variety, which is the opposite of what a focused prep cycle needs. Pramp optimizes for human partners, which inserts scheduling friction. Educative.io optimizes for breadth across topics. None of them optimize for <em>my actual bottleneck</em> — which is repeatedly drilling the specific failure modes I keep hitting in real interviews, with a feedback loop tight enough that the next attempt incorporates the previous one's lesson.</p>

      <p>So I wrote one for myself. It's a daily-driver tool. Single tenant. No SPA, no build step, no client-state library. FastAPI + Jinja + HTMX + Postgres — the boring stack — because the application logic is the interesting part and the chrome should get out of the way. The whole interface is roughly thirty templates and one CSS file, and the database has fewer tables than the editor I'm writing this in has open buffers.</p>

      <h2>The shape of the problem</h2>

      <p>Interview prep, at the level I care about, breaks into three loops that have to run concurrently:</p>

      <ul>
        <li>A <strong>retrieval loop</strong> — surfacing problems I'll fail next, not problems that look impressive on a transcript. The scheduler reads my attempt history and biases toward weak axes.</li>
        <li>A <strong>reflection loop</strong> — capturing what specifically went wrong on the last attempt, so the next attempt doesn't repeat the failure mode. Free-form notes after every attempt; daily summaries that thread them together.</li>
        <li>A <strong>calibration loop</strong> — checking my confidence against my actual performance. If I'm rating myself "4 of 5" on attempts that fail, the gap is the actual signal.</li>
      </ul>

      <p>None of the three is hard to build. What's hard is keeping them tight enough that the feedback fits inside the same prep session that generated it. A reflection that arrives the next morning is a different (much weaker) intervention than one that arrives ninety seconds after the attempt closes. LeetCode and friends can't get there because the reflection step doesn't exist as a primitive in their data model.</p>

      <h2>What "single tenant" buys</h2>

      <p>Most interview-prep tools are multi-tenant SaaS. That choice carries a long tail of architectural consequences: auth, payment, RBAC, content moderation, abuse vectors, etc. Single-tenant collapses the surface area to roughly what an internal admin panel would need. No login screen for the public; one row in <code>users</code>; allowlist-gated invite for the handful of friends who get access.</p>

      <pre><code>$ wc -l app/main.py
    2787 app/main.py</code></pre>

      <p>That's the entire backend. There are repositories under <code>app/repositories/</code> and a thin services layer with offline fallbacks under <code>app/services/</code>, but the routing, middleware, and surface handlers all live in one file. Easy to grep, easy to navigate, easy for an agent to reason about.</p>

      <h2>The agents — yes, plural</h2>

      <p>This is where the design gets weird, and where I think it's also right. I do about thirty percent of the code edits myself. The other seventy is divided between <strong>Charlie</strong>, an external autonomous coding agent that picks up issues labeled <code>complexity:s</code> or <code>complexity:m</code>, and <strong>Claude Code</strong>, the in-editor pair-programmer I use when I'm actively at the keyboard. They have different scopes, different trust levels, and different feedback channels.</p>

      <p>The thing this design protects against: I'm one operator. I will not scale by writing more code. I scale by writing better issues, better prompts, and better tokens — every one of which compresses some future amount of mechanical work into a one-shot description.</p>
    </section>
