<section id="resource-reader" class="resource-reader" hidden aria-labelledby="resource-reader-heading">
  <div class="form-actions">
    <button type="button" class="bordered-button" data-resource-close>Hide source and reflect</button>
    <a data-resource-original target="_blank" rel="noopener noreferrer">Open original in a new tab</a>
  </div>
  <h3 id="resource-reader-heading" data-resource-heading tabindex="-1">Read source</h3>
  <p class="muted" role="status">Read the source below, then hide it to explain from memory. If it stays blank or cannot open here, use the original link.</p>
  <iframe class="resource-reader__frame" title="Reading source" loading="lazy" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe>
</section>
